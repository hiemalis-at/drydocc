# keepass_entry is the KeePassXC entry's URL field, verbatim.
# Store each key below as a custom string field on that entry.
use_case: nextcloud
keepass_entry: "drydocc://nextcloud.example-vps"
target_path: /etc/drydocc/secrets/nextcloud.env
keys:
  - name: POSTGRES_PASSWORD
    purpose: nextcloud-db root password
    rotates: yearly
  - name: NEXTCLOUD_ADMIN_PASSWORD
    purpose: first-boot admin password (admin changes on first login)
    rotates: on-first-login
  - name: ETURNAL_SECRET
    purpose: shared secret between Nextcloud Talk and eturnal
    rotates: yearly
